# dsh-mobile — pair your phone with the DSH running on this computer.
# This patch is applied by the DSH profile when the package is selected as a bundle.
- insert:
    - id: dsh-mobile
      name: dsh-mobile
      config:
        # Port of the LAN bridge. 0 picks a free port.
        port: 47821
        # Bind all local interfaces so the phone can reach this computer.
        bindHost: 0.0.0.0
        # "workspace-write" is the safe default. Use "danger-full-access" to let
        # the phone run unrestricted tools; the app warns before connecting.
        permissionMode: workspace-write
        provider: deepseek-official
        model: deepseek-flash
        # Same Wi-Fi: leave this off; the phone connects directly to this computer.
        # "quick" starts an outbound Cloudflare quick tunnel, so the phone can
        # connect from another network. The URL changes on every restart and
        # Cloudflare relays plaintext HTTP; use publicUrl for a stable named tunnel.
        tunnel: off
        # cloudflaredBinary: cloudflared
        openPairingPage: true
        printTerminalQr: true
